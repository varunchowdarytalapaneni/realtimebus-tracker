services:
  db:
    image: postgis/postgis:15-3.3
    container_name: bus_tracker_db
    environment:
      POSTGRES_USER: bustracker
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bustracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/init-scripts

  redis:
    image: redis:alpine
    container_name: bus_tracker_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: